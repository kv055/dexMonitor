    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
    bearerWebhook:
      type: http
      scheme: bearer
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
