      additionalProperties: false
      required:
        - mappings
      properties:
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/BisqPaymentAccountMapping"
    BisqFundingDestinationRequest:
      type: object
      additionalProperties: false
      required:
        - address
      properties:
        address:
          type: string
    BisqFundingDestination:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - is_active
      properties:
        id:
          type: integer
        address:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BisqFundingDestinationEnvelope:
      type: object
      additionalProperties: false
      required:
        - destination
      properties:
        destination:
          oneOf:
            - $ref: "#/components/schemas/BisqFundingDestination"
            - type: "null"
    FeeLine:
      type: object
      additionalProperties: false
      required:
        - asset
        - amount
      properties:
        asset:
          type: string
        amount:
          type: number
    ExecutionDetail:
      type: object
      additionalProperties: false
      required:
        - filled_btc
        - average_rate
        - filled_fiat
        - order_status
      properties:
        filled_btc:
          type: number
        average_rate:
          type: number
        filled_fiat:
          type: number
        fees:
          type: array
          items:
            $ref: "#/components/schemas/FeeLine"
        order_status:
          type: string
        poll_incomplete:
          type: boolean
    CexSpotBuyResult:
      type: object
      additionalProperties: false
      required:
        - provider
        - pair
        - side
        - requested_btc
        - order_id
        - status
        - submitted_at
      properties:
        provider:
          type: string
        pair:
          type: string
        side:
          type: string
        requested_btc:
          type: number
        order_id:
          type: string
        status:
          type: string
        submitted_at:
          type: string
          format: date-time
        execution:
          $ref: "#/components/schemas/ExecutionDetail"
        raw: {}
    CexHedgeOpenResult:
      type: object
      additionalProperties: false
      required:
        - venue
        - instrument
        - side
        - btc_notional
        - order_id
        - status
        - submitted_at
      properties:
        venue:
          type: string
        instrument:
          type: string
        side:
          type: string
        btc_notional:
          type: number
        order_id:
          type: string
        status:
          type: string
        submitted_at:
          type: string
          format: date-time
        raw: {}
    WithdrawalResult:
      type: object
      additionalProperties: false
      required:
        - provider
        - withdrawal_id
        - wallet_address
        - amount_btc
      properties:
        provider:
          type: string
        withdrawal_id:
          type: string
        client_request_id:
          type: string
        wallet_address:
          type: string
        amount_btc:
          type: number
        cex_status:
          type: string
    DEXFundingResult:
      type: object
      additionalProperties: false
      required:
        - exchange
        - method
        - amount_btc
        - status
      properties:
        exchange:
          type: string
        method:
          type: string
        amount_btc:
          type: number
        txid:
          type: string
        payment_hash:
          type: string
        destination:
          type: string
        status:
          type: string
    PoolRefillResult:
      type: object
      additionalProperties: false
      required:
        - target_btc
        - status
        - attempt
      properties:
        target_btc:
          type: number
        current_btc:
          type: number
        status:
          type: string
        attempt:
          type: integer
          minimum: 0
    MMTransactionStatus:
      type: object
      additionalProperties: true
      required:
        - id
        - status
      properties:
        id:
          type: integer
          minimum: 1
        status:
          type: string
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        btc_pool_target_btc:
          type: number
        btc_required_liquidity:
          type: number
        btc_pool_refill_status:
          type: string
    WithdrawalTrackResult:
      type: object
      additionalProperties: false
      required:
        - provider
        - withdrawal_id
        - cex_status
        - cex_status_code
        - updated_at
      properties:
        provider:
          type: string
        withdrawal_id:
          type: string
        cex_status:
          type: string
        cex_status_code:
          type: integer
        tx_hash:
          type: string
        address:
          type: string
        amount_btc:
          type: string
        fee_btc:
          type: number
        updated_at:
          type: string
          format: date-time
        mempool:
          $ref: "#/components/schemas/MempoolTxStatus"
    MempoolTxStatus:
      type: object
      additionalProperties: false
      required:
        - txid
        - confirmed
        - confirmations
        - status_label
      properties:
        txid:
          type: string
        confirmed:
          type: boolean
        confirmations:
          type: integer
        block_height:
          type: integer
        status_label:
          type: string
    Health:
      $ref: ../../commons/api/openapi/Health.yaml
  securitySchemes:
    dashboardSession:
