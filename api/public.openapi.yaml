      tags: [raw]
      x-raw-reason: Forwards the Unified API execution quote unchanged.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Immutable execution quote
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Quote unavailable or rejected
