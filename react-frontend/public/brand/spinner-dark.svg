<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -40 220 200" fill="none" overflow="visible">
  <style>
    @keyframes pendulum-swing { 0%, 100% { transform: rotate(-26deg); } 50% { transform: rotate(26deg); } }
    @keyframes pendulum-counter { 0%, 100% { transform: rotate(26deg); } 50% { transform: rotate(-26deg); } }
    @keyframes usd-swing { 0%, 100% { transform: rotate(90deg); } 50% { transform: rotate(-90deg); } }
    @keyframes usd-counter { 0%, 100% { transform: rotate(-90deg); } 50% { transform: rotate(90deg); } }
    @keyframes currency-cycle-0 { 0%, 25% { opacity: 1; } 25.01%, 100% { opacity: 0; } }
    @keyframes currency-cycle-1 { 0%, 25% { opacity: 0; } 25.01%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes currency-cycle-2 { 0%, 50% { opacity: 0; } 50.01%, 75% { opacity: 1; } 75.01%, 100% { opacity: 0; } }
    @keyframes currency-cycle-3 { 0%, 75% { opacity: 0; } 75.01%, 100% { opacity: 1; } }
    @keyframes currency-fill { 0%, 100% { fill: #25c26b; } 25% { fill: #3b82f6; } 50% { fill: #e5484d; } 75% { fill: #a855f7; } }
    @keyframes candle-left { 0%, 50% { fill: #e5484d; } 50.01%, 100% { fill: #25c26b; } }
    @keyframes candle-right { 0%, 50% { fill: #25c26b; } 50.01%, 100% { fill: #e5484d; } }
  </style>

  <path d="M -20 60 A 100 100 0 0 1 180 60" stroke="#f3efe4" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.35"></path>

  
  <g style="transform-origin: 80px 60px; animation: usd-swing 2.6s cubic-bezier(.45,0,.55,1) infinite;">
