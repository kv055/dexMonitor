<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEX Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #f7931a;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #bc8cff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 1rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }

  .header-controls {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-left: auto;
  }

  .kpi-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    flex: 1;
    justify-content: center;
    align-items: center;
  }

  .kpi-item {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    padding-left: 0.75rem;
  }

  .kpi-item .label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .kpi-item .value {
    font-size: 0.95rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .kpi-item .sub {
    font-size: 0.65rem;
    color: var(--text-muted);
  }

  .header-controls {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .header-controls select, .header-controls button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .header-controls button:hover {
    border-color: var(--accent);
  }

  .last-updated {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .container {
    max-width: 100%;
    margin: 0 auto;
    padding: 0.75rem 0.6rem;
  }


  .exchange-tag {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
  }

  .exchange-tag.hodlhodl { background: #1a3a2a; color: var(--green); }
  .exchange-tag.robosats { background: #2a1a3a; color: var(--purple); }
  .exchange-tag.bisq { background: #3a2a1a; color: var(--accent); }

  /* Charts */
  .charts-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
  }

  .chart-card h3 {
    font-size: 0.85rem;
    margin-bottom: 0.6rem;
    color: var(--text-muted);
  }

  .chart-wrapper {
    position: relative;
    height: 200px;
  }

  /* OHLC Chart */
  .ohlc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    margin-bottom: 0.6rem;
  }

  .ohlc-card h3 {
    font-size: 0.85rem;
    margin-bottom: 0.6rem;
    color: var(--text-muted);
  }

  /* Table */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    overflow-x: auto;
  }

  .table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.6rem;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .table-header h3 {
    font-size: 0.95rem;
    color: var(--text-muted);
  }

  .table-filters {
    display: flex;
    gap: 0.5rem;
  }

  .table-filters select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
  }

  .range-inputs {
    display: flex;
    gap: 0.25rem;
    align-items: center;
  }

  .range-inputs input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
    width: 5rem;
  }

  .range-inputs span {
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  .toggle-btn {
    background: var(--bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.75rem;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .toggle-btn.active {
    background: #2a1f0a;
    color: var(--accent);
    border-color: var(--accent);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  th {
    text-align: left;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  th:hover { color: var(--text); }
  th .sort-arrow { margin-left: 4px; font-size: 0.65rem; }

  td {
    padding: 0.35rem 0.6rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tr:hover { background: rgba(255, 255, 255, 0.03); }

  .premium-low { color: var(--green); }
  .premium-mid { color: var(--accent); }
  .premium-high { color: var(--red); }

  .loading {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
  }

  .error-banner {
    background: #2d1b1b;
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
    color: var(--red);
    display: none;
  }

  @media (max-width: 768px) {
    .charts-grid { grid-template-columns: 1fr; }
    header { flex-direction: column; gap: 0.75rem; }
    .container { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>DEX Monitor</h1>
  <div class="kpi-grid" id="kpiGrid"></div>
  <div class="header-controls">
    <select id="hoursSelect">
      <option value="1">Last 1h</option>
      <option value="6">Last 6h</option>
      <option value="24" selected>Last 24h</option>
      <option value="48">Last 48h</option>
      <option value="168">Last 7d</option>
    </select>
    <button id="refreshBtn">Refresh</button>
    <span class="last-updated" id="lastUpdated"></span>
  </div>
</header>

<div class="container">
  <div id="errorBanner" class="error-banner"></div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="chart-card">
      <h3>Offer Premiums by Exchange</h3>
      <div class="chart-wrapper">
        <canvas id="premiumChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>Offers by Payment Method</h3>
      <div class="chart-wrapper">
        <canvas id="paymentChart"></canvas>
      </div>
    </div>
  </div>

  <!-- OHLC + Depth side by side -->
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:0.6rem;margin-bottom:0.6rem;">
    <div class="ohlc-card" style="margin-bottom:0;">
      <h3>Kraken BTC/EUR — DEX Premium Offer Overlay</h3>
      <div id="ohlcChart" style="height:340px;"></div>
    </div>
    <div class="ohlc-card" style="margin-bottom:0;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h3 style="margin-bottom:0;">Orderbook Depth</h3>
        <span id="depthMidPrice" style="font-size:0.85rem;color:var(--text-muted);"></span>
      </div>
      <div id="depthChart" style="height:340px;"></div>
    </div>
  </div>

  <!-- Offer Table -->
  <div class="table-card">
    <div class="table-header">
      <h3>All Offers</h3>
      <div class="table-filters">
        <div style="display:flex;flex-direction:column;gap:0.25rem;">
          <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Side</span>
          <select id="filterDirection">
          <option value="sell">Asks (Sell)</option>
          <option value="buy">Bids (Buy)</option>
        </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.25rem;">
          <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Exchange</span>
          <select id="filterExchange">
            <option value="">All Exchanges</option>
            <option value="hodlhodl">HodlHodl</option>
            <option value="robosats">Robosats</option>
            <option value="bisq">Bisq</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.25rem;">
          <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Payment</span>
          <select id="filterPayment">
            <option value="">All Payments</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.25rem;">
          <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Status</span>
          <select id="filterStatus">
            <option value="">All Orders</option>
            <option value="open">Open</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.25rem;">
          <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Premium %</span>
          <div class="range-inputs">
            <input type="number" id="filterPremiumMin" placeholder="Min" step="0.1">
            <span>–</span>
            <input type="number" id="filterPremiumMax" placeholder="Max" step="0.1">
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.25rem;">
          <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">&nbsp;</span>
          <button class="toggle-btn" id="togglePremium">Premium Only</button>
        </div>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th data-sort="exchange">Exchange <span class="sort-arrow"></span></th>
          <th data-sort="direction">Side <span class="sort-arrow"></span></th>
          <th data-sort="price">Price (EUR) <span class="sort-arrow"></span></th>
          <th data-sort="price_diff_percent">Premium <span class="sort-arrow"></span></th>
          <th data-sort="btc_min">BTC Min <span class="sort-arrow"></span></th>
          <th data-sort="btc_max">BTC Max <span class="sort-arrow"></span></th>
          <th data-sort="payment_method">Payment <span class="sort-arrow"></span></th>
          <th data-sort="first_seen">First Seen <span class="sort-arrow"></span></th>
          <th data-sort="last_seen">Last Seen <span class="sort-arrow"></span></th>
          <th data-sort="duration">Duration <span class="sort-arrow"></span></th>
        </tr>
      </thead>
      <tbody id="offerTableBody">
        <tr><td colspan="10" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = window.location.origin;

const EXCHANGE_COLORS = {
  hodlhodl: '#3fb950',
  robosats: '#bc8cff',
  bisq: '#f7931a'
};

let allOffers = [];
let sortCol = 'price_diff_percent';
let sortAsc = true;
let premiumChart = null;
let paymentChart = null;

// --- Fetch helpers ---

async function apiFetch(path) {
  const res = await fetch(`${API_BASE}${path}`);
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  return res.json();
}

function showError(msg) {
  const banner = document.getElementById('errorBanner');
  banner.textContent = msg;
  banner.style.display = 'block';
}

function clearError() {
  document.getElementById('errorBanner').style.display = 'none';
}

// --- Data loading ---

async function loadDashboard() {
  const hours = document.getElementById('hoursSelect').value;
  const direction = document.getElementById('filterDirection').value;
  clearError();

  try {
    const [stats, offers] = await Promise.all([
      apiFetch(`/api/stats?hours=${hours}`),
      apiFetch(`/api/offers?limit=1000`)
    ]);

    allOffers = offers;
    renderKPIs(stats);
    renderPremiumChart(offers);
    renderPaymentChart(offers);
    populatePaymentFilter(offers);
    renderTable();
    loadOHLC(hours);
    renderDepthChart();
    document.getElementById('lastUpdated').textContent =
      `Updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    showError(`Failed to load data: ${e.message}`);
  }
}

// --- KPI Cards ---

function renderKPIs(stats) {
  const grid = document.getElementById('kpiGrid');

  const totalOffers = stats.offer_counts.reduce((s, e) => s + e.offer_count, 0);

  let html = `
    <div class="kpi-item">
      <span class="label">Total Offers</span>
      <span class="value">${totalOffers}</span>
      <span class="sub">${stats.offer_counts.map(e =>
        `<span class="exchange-tag ${e.exchange}">${e.exchange}</span> ${e.offer_count}`
      ).join(' ')}</span>
    </div>
  `;

  for (const ps of stats.price_stats) {
    html += `
      <div class="kpi-item">
        <span class="label"><span class="exchange-tag ${ps.exchange}">${ps.exchange}</span> BTC</span>
        <span class="value">&euro;${formatNum(ps.avg_price)}</span>
        <span class="sub">&euro;${formatNum(ps.min_price)} – &euro;${formatNum(ps.max_price)}</span>
      </div>
    `;
  }

  const avgPremium = allOffers.length
    ? (allOffers.reduce((s, o) => s + (o.price_diff_percent || 0), 0) / allOffers.length).toFixed(1)
    : '—';

  html += `
    <div class="kpi-item">
      <span class="label">Avg Premium</span>
      <span class="value ${premiumClass(parseFloat(avgPremium))}">${avgPremium}%</span>
    </div>
  `;

  grid.innerHTML = html;
}

// --- Charts ---

function renderPremiumChart(offers) {
  const ctx = document.getElementById('premiumChart').getContext('2d');
  if (premiumChart) premiumChart.destroy();

  const sorted = [...offers].sort((a, b) => (a.price_diff_percent || 0) - (b.price_diff_percent || 0));

  const datasets = {};
  sorted.forEach((o, i) => {
    const ex = o.exchange || 'unknown';
    if (!datasets[ex]) datasets[ex] = { label: ex, data: [], backgroundColor: EXCHANGE_COLORS[ex] || '#888' };
    datasets[ex].data.push({ x: i, y: o.price_diff_percent || 0 });
  });

  premiumChart = new Chart(ctx, {
    type: 'bar',
    data: { datasets: Object.values(datasets) },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8b949e', font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (c) => {
              const o = sorted[c.raw.x];
              return `${c.dataset.label}: ${c.raw.y}% — ${o.payment_method} — €${formatNum(o.price)}`;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          display: false
        },
        y: {
          title: { display: true, text: 'Premium %', color: '#8b949e' },
          ticks: { color: '#8b949e', callback: v => v + '%' },
          grid: { color: '#21262d' }
        }
      }
    }
  });
}

function renderPaymentChart(offers) {
  const ctx = document.getElementById('paymentChart').getContext('2d');
  if (paymentChart) paymentChart.destroy();

  const counts = {};
  offers.forEach(o => {
    const pm = o.payment_method || 'Unknown';
    counts[pm] = (counts[pm] || 0) + 1;
  });

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const labels = sorted.map(e => e[0]);
  const data = sorted.map(e => e[1]);

  const palette = [
    '#f7931a', '#3fb950', '#bc8cff', '#58a6ff', '#f85149',
    '#d29922', '#8b949e', '#39d353', '#db61a2', '#79c0ff'
  ];

  paymentChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: palette.slice(0, labels.length),
        borderColor: '#161b22',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          labels: { color: '#8b949e', font: { size: 11 }, padding: 8 }
        }
      }
    }
  });
}

// --- OHLC Chart ---

async function loadOHLC(hours) {
  try {
    const [data, premiumOffers] = await Promise.all([
      apiFetch(`/api/ohlc?hours=${hours}`),
      apiFetch(`/api/premium_offers?hours=${hours}&limit=1000`)
    ]);
    renderOHLC(data, premiumOffers, hours);
  } catch (e) {
    console.error('OHLC load failed:', e);
  }
}

function renderOHLC(data, offers, hours) {
  const candles = data.candles;
  const traces = [];

  if (candles.length) {
    traces.push({
      type: 'candlestick',
      x: candles.map(c => c.time + 'Z'),
      open: candles.map(c => c.open),
      high: candles.map(c => c.high),
      low: candles.map(c => c.low),
      close: candles.map(c => c.close),
      increasing: { line: { color: '#3fb950' } },
      decreasing: { line: { color: '#f85149' } },
      name: 'Kraken BTC/EUR',
    });
  }

  const dotColors = { bisq: '#f7931a', hodlhodl: '#3fb950', robosats: '#bc8cff' };
  const dirSymbol = { sell: 'triangle-down', buy: 'triangle-up' };
  const groups = {};

  offers.forEach(o => {
    const key = `${o.exchange}_${o.direction}`;
    if (!groups[key]) groups[key] = { x: [], y: [], text: [], exchange: o.exchange, direction: o.direction };
    const g = groups[key];
    g.x.push((o.first_seen || o.time).replace(' ', 'T') + 'Z');
    g.y.push(o.price);
    const pct = (o.price_diff_percent ?? o.premium) != null ? (o.price_diff_percent ?? o.premium).toFixed(1) + '%' : '—';
    g.text.push(`${o.exchange} ${o.direction === 'buy' ? 'Bid' : 'Ask'}<br>€${Number(o.price).toLocaleString('de-DE')}<br>Premium: ${pct}<br>${o.payment_method || ''}`);
  });

  Object.values(groups).forEach(g => {
    traces.push({
      type: 'scatter', mode: 'markers',
      x: g.x, y: g.y, text: g.text, hoverinfo: 'text',
      name: `${g.exchange} ${g.direction === 'buy' ? 'Bids' : 'Asks'}`,
      marker: { color: dotColors[g.exchange] || '#888', size: 7, symbol: dirSymbol[g.direction] || 'circle', line: { width: 1, color: '#0d1117' } },
    });
  });

  const layout = {
    paper_bgcolor: '#161b22',
    plot_bgcolor: '#0d1117',
    font: { color: '#8b949e', size: 11 },
    xaxis: {
      type: 'date', gridcolor: '#21262d',
      rangeslider: { visible: false },
      range: [new Date(Date.now() - hours * 3600 * 1000).toISOString(), new Date().toISOString()],
    },
    yaxis: {
      title: 'Price (EUR)', gridcolor: '#21262d',
      side: 'left', tickformat: ',.0f',
    },
    legend: { orientation: 'h', y: -0.15, font: { size: 10 } },
    margin: { l: 70, r: 10, t: 10, b: 40 },
  };

  Plotly.newPlot('ohlcChart', traces, layout, { responsive: true, displayModeBar: false });
}

// --- Orderbook Depth Chart ---

function renderDepthChart() {
  // Filter to open offers only (last_seen == per-exchange max)
  const lastSeen = {};
  allOffers.forEach(o => {
    if (!lastSeen[o.exchange] || o.last_seen > lastSeen[o.exchange]) lastSeen[o.exchange] = o.last_seen;
  });
  const open = allOffers.filter(o => o.last_seen === lastSeen[o.exchange]);

  if (!open.length) return;

  // Derive mid-price as average ref_price across open offers
  const midPrice = open.reduce((s, o) => s + (o.ref_price || 0), 0) / open.length;

  // Aggregate volume per price level
  const bidMap = {}, askMap = {};
  open.forEach(o => {
    const map = o.direction === 'buy' ? bidMap : askMap;
    map[o.price] = (map[o.price] || 0) + (o.btc_max || 0);
  });

  const rawBids = Object.entries(bidMap).map(([price, btc]) => ({ price: +price, btc }));
  const rawAsks = Object.entries(askMap).map(([price, btc]) => ({ price: +price, btc }));

  rawBids.sort((a, b) => b.price - a.price);
  rawAsks.sort((a, b) => a.price - b.price);

  let cumBid = 0;
  const bids = rawBids.map(o => { cumBid += o.btc; return { price: o.price, cum: cumBid }; });
  let cumAsk = 0;
  const asks = rawAsks.map(o => { cumAsk += o.btc; return { price: o.price, cum: cumAsk }; });

  const maxVol = Math.max(cumBid, cumAsk);

  const traces = [
    {
      x: bids.map(b => b.cum), y: bids.map(b => b.price),
      type: 'scatter', mode: 'lines', name: 'Bids',
      fill: 'tozerox', line: { color: '#3fb950', width: 1.5, shape: 'vh' },
      fillcolor: 'rgba(63,185,80,0.15)',
      hovertemplate: 'Bid €%{y:,.0f}<br>Cum: %{x:.3f} BTC<extra></extra>',
    },
    {
      x: asks.map(a => a.cum), y: asks.map(a => a.price),
      type: 'scatter', mode: 'lines', name: 'Asks',
      fill: 'tozerox', line: { color: '#f85149', width: 1.5, shape: 'vh' },
      fillcolor: 'rgba(248,81,73,0.15)',
      hovertemplate: 'Ask €%{y:,.0f}<br>Cum: %{x:.3f} BTC<extra></extra>',
    },
    {
      x: [0, maxVol], y: [midPrice, midPrice],
      type: 'scatter', mode: 'lines', name: 'Mid',
      line: { color: '#8b949e', width: 1, dash: 'dot' },
      hoverinfo: 'skip', showlegend: false,
    },
  ];

  const minPrice = rawBids.length ? Math.min(...rawBids.map(b => b.price)) : midPrice;
  const maxPrice = rawAsks.length ? Math.max(...rawAsks.map(a => a.price)) : midPrice;
  const priceRange = Math.max(midPrice - minPrice, maxPrice - midPrice) * 1.05 || midPrice * 0.05;

  const layout = {
    paper_bgcolor: '#161b22',
    plot_bgcolor: '#0d1117',
    font: { color: '#8b949e', size: 11 },
    xaxis: { title: 'Cumulative BTC', gridcolor: '#21262d', range: [0, maxVol * 1.05] },
    yaxis: {
      title: 'Price (EUR)', gridcolor: '#21262d', tickformat: ',.0f',
      side: 'left',
      range: [midPrice - priceRange, midPrice + priceRange],
    },
    legend: { orientation: 'h', y: -0.2, font: { size: 10 } },
    margin: { l: 70, r: 20, t: 10, b: 50 },
    hovermode: 'y unified',
  };

  const highestBid = rawBids.length ? rawBids[0].price : null;
  const lowestAsk  = rawAsks.length ? rawAsks[0].price : null;
  const spreadText = highestBid && lowestAsk
    ? ` · Spread €${(lowestAsk - highestBid).toLocaleString('de-DE')}`
    : '';
  document.getElementById('depthMidPrice').textContent =
    `Mid €${Math.round(midPrice).toLocaleString('de-DE')}${spreadText}`;

  Plotly.newPlot('depthChart', traces, layout, { responsive: true, displayModeBar: false });
}

// --- Table ---

function populatePaymentFilter(offers) {
  const methods = [...new Set(offers.map(o => o.payment_method).filter(Boolean))].sort();
  const sel = document.getElementById('filterPayment');
  sel.innerHTML = '<option value="">All Payments</option>' +
    methods.map(m => `<option value="${m}">${m}</option>`).join('');
}

function renderTable() {
  const exFilter = document.getElementById('filterExchange').value;
  const pmFilter = document.getElementById('filterPayment').value;
  const dirFilter = document.getElementById('filterDirection').value;
  const statusFilter = document.getElementById('filterStatus').value;

  // Compute per-exchange last snapshot time
  const lastSeen = {};
  allOffers.forEach(o => {
    if (!lastSeen[o.exchange] || o.last_seen > lastSeen[o.exchange]) lastSeen[o.exchange] = o.last_seen;
  });

  const premiumMin = parseFloat(document.getElementById('filterPremiumMin').value);
  const premiumMax = parseFloat(document.getElementById('filterPremiumMax').value);
  const premiumOnly = document.getElementById('togglePremium').classList.contains('active');

  let filtered = allOffers;
  if (dirFilter) filtered = filtered.filter(o => o.direction === dirFilter);
  if (exFilter) filtered = filtered.filter(o => o.exchange === exFilter);
  if (pmFilter) filtered = filtered.filter(o => o.payment_method === pmFilter);
  if (statusFilter === 'open')   filtered = filtered.filter(o => o.last_seen === lastSeen[o.exchange]);
  if (statusFilter === 'closed') filtered = filtered.filter(o => o.last_seen !== lastSeen[o.exchange]);
  if (!isNaN(premiumMin)) filtered = filtered.filter(o => (o.price_diff_percent || 0) >= premiumMin);
  if (!isNaN(premiumMax)) filtered = filtered.filter(o => (o.price_diff_percent || 0) <= premiumMax);
  if (premiumOnly) filtered = filtered.filter(o =>
    (o.direction === 'sell' && o.price < o.ref_price) ||
    (o.direction === 'buy'  && o.price > o.ref_price)
  );

  filtered.sort((a, b) => {
    let va, vb;
    if (sortCol === 'duration') {
      va = durationMinutes(a.first_seen, a.last_seen);
      vb = durationMinutes(b.first_seen, b.last_seen);
    } else {
      va = a[sortCol]; vb = b[sortCol];
    }
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('offerTableBody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="loading">No offers found</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(o => {
    o.duration = durationMinutes(o.first_seen, o.last_seen);
    return `
    <tr>
      <td><span class="exchange-tag ${o.exchange}">${o.exchange}</span></td>
      <td class="${o.direction === 'buy' ? 'premium-low' : 'premium-high'}">${o.direction === 'buy' ? 'Bid' : 'Ask'}</td>
      <td>&euro;${formatNum(o.price)}</td>
      <td class="${premiumClass(o.price_diff_percent)}">${o.price_diff_percent != null ? o.price_diff_percent.toFixed(1) + '%' : '—'}</td>
      <td>${o.btc_min}</td>
      <td>${o.btc_max}</td>
      <td>${o.payment_method || '—'}</td>
      <td>${formatTime(o.first_seen)}</td>
      <td>${formatTime(o.last_seen)}</td>
      <td>${formatDuration(o.first_seen, o.last_seen)}</td>
    </tr>`;
  }).join('');

  // Update sort arrows
  document.querySelectorAll('th[data-sort]').forEach(th => {
    const arrow = th.querySelector('.sort-arrow');
    arrow.textContent = th.dataset.sort === sortCol ? (sortAsc ? '▲' : '▼') : '↕';
    arrow.style.opacity = th.dataset.sort === sortCol ? '1' : '0.3';
  });
}

// --- Helpers ---

function formatNum(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString('de-DE', { maximumFractionDigits: 0 });
}

function formatTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts.replace(' ', 'T') + 'Z');
  return d.toLocaleString('de-DE', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function durationMinutes(first, last) {
  if (!first || !last) return 0;
  const a = new Date(first.replace(' ', 'T') + 'Z');
  const b = new Date(last.replace(' ', 'T') + 'Z');
  return Math.round((b - a) / 60000);
}

function formatDuration(first, last) {
  const mins = durationMinutes(first, last);
  if (mins < 1) return 'new';
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h < 24) return `${h}h ${m}m`;
  const d = Math.floor(h / 24);
  return `${d}d ${h % 24}h`;
}

function premiumClass(pct) {
  if (pct == null) return '';
  if (pct <= 2) return 'premium-low';
  if (pct <= 4) return 'premium-mid';
  return 'premium-high';
}

// --- Event listeners ---

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = true; }
    renderTable();
  });
});

document.getElementById('filterDirection').addEventListener('change', renderTable);
document.getElementById('filterExchange').addEventListener('change', renderTable);
document.getElementById('filterPayment').addEventListener('change', renderTable);
document.getElementById('filterStatus').addEventListener('change', renderTable);
document.getElementById('filterPremiumMin').addEventListener('input', renderTable);
document.getElementById('filterPremiumMax').addEventListener('input', renderTable);
document.getElementById('togglePremium').addEventListener('click', function () {
  this.classList.toggle('active');
  renderTable();
});
document.getElementById('hoursSelect').addEventListener('change', loadDashboard);
document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

// Auto-refresh every 5 minutes
setInterval(loadDashboard, 5 * 60 * 1000);

// Initial load
loadDashboard();
</script>
