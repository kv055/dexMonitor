services:
  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
    network_mode: host
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-sf", "--socks5", "127.0.0.1:9050", "http://example.com"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  bisq:
    build:
      context: .
      dockerfile: Dockerfile.bisq
    network_mode: host
    depends_on:
      tor:
        condition: service_healthy
    environment:
      - BISQ_VERSION=1.9.22
    volumes:
      - bisq-data:/home/appuser/.local/share/Bisq
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    depends_on:
      tor:
        condition: service_healthy
    environment:
      - DB_PATH=/app/data/orderbook.db
      - SNAPSHOT_INTERVAL_MIN=15
      - FRONTEND_DIR=/app/react-frontend/dist
    volumes:
      - orderbook-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    restart: unless-stopped

  snapshot:
    build:
      context: .
      dockerfile: Dockerfile.snapshot
    network_mode: host
    depends_on:
      tor:
        condition: service_healthy
    environment:
      - DB_PATH=/app/data/orderbook.db
      - BISQ_GRPC_HOST=localhost:9998
      - PRICE_PROVIDER=bisq_tor
      - SNAPSHOT_INTERVAL_MIN=15
    volumes:
      - orderbook-data:/app/data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    restart: unless-stopped

volumes:
  orderbook-data:
  bisq-data:
